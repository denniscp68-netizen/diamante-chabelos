<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minijuego Diamante GTA</title>
<style>
  body {
    background-color: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }

  h1 {
    margin-bottom: 20px;
    font-size: 22px;
  }

  canvas {
    background: radial-gradient(circle at center, #1a1a1a 60%, #000);
    border: 2px solid #444;
    border-radius: 10px;
  }

  #result {
    margin-top: 20px;
    font-size: 28px;
    font-weight: bold;
  }
</style>
</head>
<body>
<h1>Presiona <span style="color:orange;">E</span> cuando la bolita pase por los cuadros iluminados</h1>
<canvas id="gameCanvas" width="400" height="400"></canvas>
<div id="result"></div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const result = document.getElementById("result");

const cx = canvas.width / 2;
const cy = canvas.height / 2;
const size = 120;
let t = 0;
let speed = 0.004;
let canPress = true;
let targets = [];
let totalTargets = 6;

// puntos base del diamante
const corners = [
  { x: cx, y: cy - size }, // arriba
  { x: cx + size, y: cy }, // derecha
  { x: cx, y: cy + size }, // abajo
  { x: cx - size, y: cy }  // izquierda
];

function interpolate(p1, p2, t) {
  return { x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t };
}

function getPointOnDiamond(progress) {
  const segment = (progress * 4) % 4;
  const i = Math.floor(segment);
  const localT = segment - i;
  const next = (i + 1) % 4;
  return interpolate(corners[i], corners[next], localT);
}

// genera objetivos aleatorios
function generateTargets() {
  targets = [];
  for (let i = 0; i < totalTargets; i++) {
    const rand = Math.random();
    const pos = getPointOnDiamond(rand);
    targets.push({ ...pos, hit: false });
  }
}

// dibuja figura principal
function drawDiamond() {
  ctx.strokeStyle = "#888";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(corners[0].x, corners[0].y);
  for (let i = 1; i < corners.length; i++) {
    ctx.lineTo(corners[i].x, corners[i].y);
  }
  ctx.closePath();
  ctx.stroke();
}

// dibuja los cuadros objetivo
function drawTargets() {
  for (const t of targets) {
    if (t.hit) continue;
    ctx.fillStyle = "orange";
    ctx.strokeStyle = "#aaa";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rect(t.x - 12, t.y - 12, 24, 24);
    ctx.fill();
    ctx.stroke();
  }
}

// posición de la bolita
function getMarkerPosition() {
  return getPointOnDiamond(t);
}

// dibuja la bolita
function drawMarker() {
  const pos = getMarkerPosition();
  ctx.fillStyle = "cyan";
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, 10, 0, Math.PI * 2);
  ctx.fill();
  return pos;
}

// calcula distancia
function distance(a, b) {
  return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
}

function resetGame(message, color) {
  result.textContent = message;
  result.style.color = color;
  setTimeout(() => {
    result.textContent = "";
    generateTargets();
  }, 1500);
}

function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawDiamond();
  drawTargets();
  drawMarker();
  t += speed;
  if (t > 1) t -= 1;
  requestAnimationFrame(update);
}

document.addEventListener("keydown", (e) => {
  if (e.key.toLowerCase() === "e" && canPress) {
    canPress = false;
    const markerPos = getMarkerPosition();
    let hitSomething = false;

    for (const target of targets) {
      if (!target.hit && distance(markerPos, target) < 25) {
        target.hit = true;
        hitSomething = true;
      }
    }

    if (hitSomething) {
      const remaining = targets.filter(t => !t.hit).length;
      if (remaining === 0) {
        resetGame("🏆 ¡Completado!", "lime");
      } else {
        result.textContent = `🎯 Acertaste (${totalTargets - remaining}/${totalTargets})`;
        result.style.color = "yellow";
        setTimeout(() => result.textContent = "", 800);
      }
    } else {
      resetGame("❌ Fallaste, reiniciando...", "red");
    }

    setTimeout(() => { canPress = true; }, 300);
  }
});

generateTargets();
update();
</script>
</body>
</html>
